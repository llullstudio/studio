
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0eeea}
.scene{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:24px;padding:2rem
}
.card{
  width:540px;max-width:100%;aspect-ratio:3/2;
  position:relative;overflow:hidden;border-radius:1px;
  cursor:pointer;
  background:linear-gradient(135deg, #c8ddd8 0%, #b8ceca 40%, #c4d8d4 100%);
  box-shadow:
    inset 0 0 60px rgba(180,220,210,.4),
    0 2px 24px rgba(0,0,0,.12),
    0 0 0 .5px rgba(255,255,255,.6);
  transition:all .3s ease
}
.card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.5) 0%,transparent 50%,rgba(200,230,220,.2) 100%);
  pointer-events:none
}
/* grid lines */
.grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(80,120,110,.12) 1px, transparent 1px),
    linear-gradient(90deg, rgba(80,120,110,.12) 1px, transparent 1px);
  background-size:36px 36px;
  pointer-events:none
}
/* edge glow */
.edge-glow{
  position:absolute;inset:0;
  box-shadow:inset 0 0 40px rgba(240,200,100,.18),
             inset 0 0 8px rgba(240,200,100,.1);
  pointer-events:none
}
/* labels */
.labels{
  position:absolute;bottom:22px;left:22px;right:22px;
  display:flex;flex-direction:column;gap:4px;
  transition:opacity .25s ease
}
.l-type{
  font-family:system-ui,sans-serif;font-size:10px;font-weight:600;
  letter-spacing:.28em;text-transform:uppercase;
  color:rgba(20,50,40,.55)
}
.l-title{
  font-family:system-ui,sans-serif;font-size:18px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
  color:rgba(15,40,35,.8);line-height:1.1
}
.l-family{
  font-family:system-ui,sans-serif;font-size:10px;font-weight:500;
  letter-spacing:.24em;text-transform:uppercase;
  color:rgba(20,50,40,.45);
  display:flex;align-items:center;gap:6px
}
/* glyph — mechanism: hollow circles + arrows */
.glyph{display:inline-block;vertical-align:middle}
/* finding — hidden at rest */
.finding{
  position:absolute;bottom:22px;left:22px;right:22px;
  font-family:Georgia,serif;font-style:italic;font-size:12px;
  line-height:1.55;color:rgba(10,30,25,.75);
  opacity:0;transition:opacity .3s ease .1s;
  pointer-events:none
}
/* hover */
.card:hover{
  background:linear-gradient(135deg, #e8f4f0 0%, #ddeee8 40%, #e4f0ec 100%);
  box-shadow:
    0 4px 32px rgba(0,0,0,.14),
    0 0 0 .5px rgba(255,255,255,.8)
}
.card:hover .grid{opacity:.3}
.card:hover .labels{opacity:0}
.card:hover .finding{opacity:1}

/* type badge */
.badge{
  position:absolute;top:18px;right:18px;
  font-family:system-ui,sans-serif;font-size:9px;font-weight:600;
  letter-spacing:.24em;text-transform:uppercase;
  color:rgba(20,50,40,.45);
  border:.5px solid rgba(20,50,40,.2);
  padding:4px 8px;
}
</style>
<div class="scene">
  <div class="card" title="hover to reveal">
    <div class="grid"></div>
    <div class="edge-glow"></div>
    <div class="badge">Study 02</div>
    <div class="labels">
      <span class="l-type">Cognitive Cellar</span>
      <span class="l-title">The Cuckoo<br>Protocol</span>
      <span class="l-family">
        <svg class="glyph" width="28" height="14" viewBox="0 0 28 14" fill="none">
          <circle cx="4" cy="7" r="2.5" stroke="rgba(20,50,40,.5)" stroke-width="1"/>
          <circle cx="14" cy="7" r="2.5" stroke="rgba(20,50,40,.5)" stroke-width="1"/>
          <circle cx="24" cy="7" r="2.5" stroke="rgba(20,50,40,.5)" stroke-width="1"/>
          <line x1="6.6" y1="7" x2="11.4" y2="7" stroke="rgba(20,50,40,.4)" stroke-width=".8"/>
          <line x1="16.6" y1="7" x2="21.4" y2="7" stroke="rgba(20,50,40,.4)" stroke-width=".8"/>
          <polyline points="10.2,5 11.4,7 10.2,9" fill="none" stroke="rgba(20,50,40,.4)" stroke-width=".8"/>
          <polyline points="20.2,5 21.4,7 20.2,9" fill="none" stroke="rgba(20,50,40,.4)" stroke-width=".8"/>
        </svg>
        Mechanism
      </span>
    </div>
    <div class="finding">
      Franchise parasitism is a five-stage mechanism: mimicry, eviction,<br>
      parasitic growth, retroactive contamination.<br>
      The uniform stops being a reliable cue.
      <div style="margin-top:10px;font-family:system-ui,sans-serif;font-style:normal;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(20,50,40,.4)">02 · Mechanism · Published</div>
    </div>
  </div>
  <div style="font-family:system-ui,sans-serif;font-size:11px;color:rgba(0,0,0,.3);letter-spacing:.12em;text-transform:uppercase">Hover the card</div>
</div>
