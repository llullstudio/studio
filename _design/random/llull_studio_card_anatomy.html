*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
.lab{background:#0c0b09;padding:40px;font-family:'JetBrains Mono',monospace;}

.ct{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8a6530;}
.csep{color:#3d3a34;font-size:9px;}
.cf{display:flex;align-items:center;gap:4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7a7468;}
.cn{font-size:10px;letter-spacing:.1em;color:#3d3a34;}
.title{font-family:'EB Garamond',serif;font-size:1.3rem;font-weight:400;color:#d4cfc6;line-height:1.25;margin-bottom:5px;}
.finding{font-family:'EB Garamond',serif;font-style:italic;font-size:1.05rem;color:rgba(212,207,198,.88);line-height:1.45;}
.meta{font-size:10px;color:#7a7468;margin-top:9px;opacity:0;transform:translateY(4px);transition:opacity .25s cubic-bezier(.25,.6,.3,1),transform .25s cubic-bezier(.25,.6,.3,1);}
.card:hover .meta{opacity:1;transform:translateY(0);}
