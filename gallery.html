<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Gallery — llUll Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── THEME TOKENS (ambient state on <html data-theme>) ───────────── */
    :root {
      --serif:   'EB Garamond', Georgia, serif;
      --mono:    'JetBrains Mono', 'Courier New', monospace;
      --grotesk: 'Space Grotesk', system-ui, sans-serif;

      --ease: cubic-bezier(0.25, 0.6, 0.3, 1);
      --frost-dur: 250ms;
      --blur-rest: 14px;

      /* type base hexes (locked — color = type) */
      --study:      #2a5c3a;
      --instrument: #344e80;
      --dispatch:   #c89244;
      --plate:      #8a8276;
    }

    /* DAY — the gallery is light and cool. Default. */
    html[data-theme="day"] {
      --ground:    #e7ecec;   /* lab white, faint cool cast */
      --ground-2:  #dbe3e2;
      --ink:       #1a1f1e;
      --ink-dim:   #5d6664;
      --ink-faint: #97a09d;
      --rule:      rgba(22,30,29,.15);
      --accent:    #2f6b58;   /* desaturated lab teal-green */
      --glow:      rgba(255,255,255,.92);
      --sil:       rgba(16,24,22,.52);     /* dark specimen behind frost */
      --badge-bd:  rgba(255,255,255,.92);
      --badge-fill:rgba(255,255,255,.94);
      --pane-study:      #c8dacb;
      --pane-instrument: #c6d2e2;
      --pane-dispatch:   #e7dcc0;
      --pane-plate:      #dbe0dd;
    }
    /* DAWN — dim, warming light */
    html[data-theme="dawn"] {
      --ground:    #e8e0d6;
      --ground-2:  #ded5c9;
      --ink:       #241f18;
      --ink-dim:   #6e6457;
      --ink-faint: #9a8f7e;
      --rule:      rgba(36,31,24,.16);
      --accent:    #b07d2e;
      --glow:      rgba(255,246,232,.8);
      --sil:       rgba(28,22,14,.5);
      --badge-bd:  rgba(255,252,244,.82);
      --badge-fill:rgba(255,252,244,.88);
      --pane-study:      #c9d6c6;
      --pane-instrument: #c8cfdd;
      --pane-dispatch:   #ecd8b6;
      --pane-plate:      #ddd5c8;
    }
    /* DUSK — ultra-warm, low sun */
    html[data-theme="dusk"] {
      --ground:    #180d04;
      --ground-2:  #211408;
      --ink:       #ece0d0;
      --ink-dim:   #b09a82;
      --ink-faint: #6e5c46;
      --rule:      rgba(240,224,200,.18);
      --accent:    #f0a030;
      --glow:      rgba(120,70,24,.35);
      --sil:       rgba(0,0,0,.6);
      --badge-bd:  rgba(255,235,205,.6);
      --badge-fill:rgba(255,235,205,.12);
      --pane-study:      #1d2a1d;
      --pane-instrument: #1a2233;
      --pane-dispatch:   #3a2912;
      --pane-plate:      #241c12;
    }
    /* NIGHT — warm near-black; panes barely glow */
    html[data-theme="night"] {
      --ground:    #0c0b09;
      --ground-2:  #131210;
      --ink:       #d4cfc6;
      --ink-dim:   #8a8276;
      --ink-faint: #4a463f;
      --rule:      rgba(255,255,255,.14);
      --accent:    #c89244;
      --glow:      rgba(70,52,28,.3);
      --sil:       rgba(0,0,0,.55);
      --badge-bd:  rgba(255,255,255,.5);
      --badge-fill:rgba(255,255,255,.1);
      --pane-study:      #16241a;
      --pane-instrument: #161d2e;
      --pane-dispatch:   #2a2113;
      --pane-plate:      #1b1915;
    }

    html { font-size: 16px; }
    body {
      background: var(--ground);
      color: var(--ink);
      font-family: var(--serif);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background var(--frost-dur) var(--ease), color var(--frost-dur) var(--ease);
    }

    /* ── HEADER ──────────────────────────────────────────────────────── */
    header {
      padding: 3.5rem 4rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--rule);
    }
    .wordmark {
      font-family: var(--grotesk);
      font-size: 1.1rem; font-weight: 600;
      letter-spacing: 0.12em; color: var(--accent);
    }
    .wordmark a { color: inherit; text-decoration: none; }
    .wordmark .studio { font-family: var(--mono); font-weight: 400; color: var(--ink-dim); }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 1.2rem; }
    nav.header-nav { display: flex; gap: 1.8rem; }
    nav.header-nav a {
      font-family: var(--mono); font-size: 0.8rem; font-weight: 400;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ink-dim); text-decoration: none;
      transition: color 160ms var(--ease);
    }
    nav.header-nav a:hover, nav.header-nav a[aria-current] { color: var(--accent); }
    nav.header-nav a[aria-current] { color: var(--ink); }

    /* ambient toggle */
    .ambient { display: flex; gap: 2px; }
    .ambient button {
      font-family: var(--mono); font-size: 0.62rem; font-weight: 500;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--ink-faint); background: transparent;
      border: 1px solid var(--rule); border-radius: 2px;
      padding: 4px 9px; cursor: pointer;
      transition: all 160ms var(--ease);
    }
    .ambient button:hover { color: var(--ink-dim); }
    .ambient button[aria-pressed="true"] { color: var(--ground); background: var(--accent); border-color: var(--accent); }

    /* ── TITLE BLOCK + FILTERS ───────────────────────────────────────── */
    .gallery-head { padding: 2.5rem 4rem 1.5rem; }
    .gallery-head h1 {
      font-family: var(--serif); font-weight: 400; font-size: 2.6rem;
      line-height: 1.15; letter-spacing: -0.01em;
    }
    .gallery-head h1 em { font-style: italic; color: var(--accent); }
    .gallery-head .lede {
      font-family: var(--serif); font-size: 1.15rem; color: var(--ink-dim);
      margin-top: 0.6rem; max-width: 46ch; line-height: 1.5;
    }

    .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.8rem; align-items: center; }
    .filters .flabel {
      font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--ink-faint); margin-right: 0.4rem;
    }
    .filters button {
      font-family: var(--mono); font-size: 0.74rem; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--ink-dim); background: transparent;
      border: 1px solid var(--rule); border-radius: 3px;
      padding: 6px 13px; cursor: pointer;
      transition: all 160ms var(--ease);
    }
    .filters button:hover { color: var(--ink); border-color: var(--ink-faint); }
    .filters button[aria-pressed="true"] {
      color: var(--ground); background: var(--ink); border-color: var(--ink);
    }
    .filters button .dot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      margin-right: 6px; vertical-align: middle;
    }

    /* ── GALLERY GRID ────────────────────────────────────────────────── */
    main { flex: 1; padding: 1rem 4rem 4rem; max-width: 1720px; width: 100%; margin: 0 auto; }
    .type-section { padding: 2rem 0 1rem; }
    .type-section.hidden { display: none; }
    .section-label {
      font-family: var(--mono); font-size: 0.8rem; font-weight: 500;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-dim);
      display: flex; align-items: baseline; gap: 0.8rem; margin-bottom: 1.6rem;
    }
    .section-label .count { color: var(--ink-faint); font-size: 0.7rem; }
    .section-label .swatch { width: 9px; height: 9px; border-radius: 2px; align-self: center; }

    .grid { display: grid; gap: 36px; }
    .grid-study      { grid-template-columns: repeat(3, 1fr); }
    .grid-instrument { grid-template-columns: repeat(4, 1fr); }
    .grid-dispatch   { grid-template-columns: repeat(5, 1fr); }
    .grid-plate      { grid-template-columns: repeat(4, 1fr); }

    @media (max-width: 1400px) {
      .grid-study { grid-template-columns: repeat(2, 1fr); }
      .grid-dispatch { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 1100px) {
      header, .gallery-head, main { padding-left: 2rem; padding-right: 2rem; }
      .grid-instrument { grid-template-columns: repeat(3, 1fr); }
      .grid-dispatch { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 720px) {
      header { flex-direction: column; gap: 1.5rem; }
      .grid-study, .grid-instrument, .grid-dispatch, .grid-plate { grid-template-columns: repeat(2, 1fr); }
      .gallery-head h1 { font-size: 2rem; }
    }

    /* ── THE CARD (Specimen Shift) ───────────────────────────────────── */
    .card {
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      display: block;
      text-decoration: none;
      color: var(--ink);
      isolation: isolate;
      box-shadow: 0 1px 0 var(--rule), 0 18px 40px -28px rgba(0,0,0,.45);
    }
    .card.study      { aspect-ratio: 3 / 2;  background: var(--pane-study); }
    .card.instrument { aspect-ratio: 1 / 1;  background: var(--pane-instrument); }
    .card.dispatch   { aspect-ratio: 2 / 3;  background: var(--pane-dispatch); }
    .card.plate      { aspect-ratio: 1 / 1;  background: var(--pane-plate); }

    /* L1 backlight glow — warmth from within */
    .card::before {
      content: ""; position: absolute; inset: 0; z-index: 1;
      background: radial-gradient(120% 90% at 50% 22%, var(--glow), transparent 70%);
      pointer-events: none;
    }

    /* num + badge (identity row) */
    .card .num {
      position: absolute; top: 18px; left: 20px; z-index: 4;
      font-family: var(--mono); font-size: 0.8rem; font-weight: 500;
      letter-spacing: 0.06em; color: var(--ink-dim);
    }
    .card .badge {
      position: absolute; top: 16px; right: 18px; z-index: 4;
      display: flex; align-items: center; gap: 6px;
      border: 2px solid var(--badge-bd); border-radius: 3px;
      background: var(--badge-fill);
      padding: 4px 8px;
      backdrop-filter: blur(2px);
    }
    .card .badge .bglyph { font-family: var(--mono); font-size: 0.72rem; font-weight: 700; color: var(--ink); letter-spacing: 0; }
    .card .badge .blabel { font-family: var(--mono); font-size: 0.56rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-dim); }

    /* L3 zone — bottom anchored, copy always sharp */
    .card .zone {
      position: absolute; left: 0; right: 0; top: 56px; bottom: auto; z-index: 4;
      padding: 0 22px;
    }
    .card .zone .labels {
      font-family: var(--mono); font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.24em; text-transform: uppercase;
    }
    .card .zone .labels .ztype { color: var(--ink); }
    .card .zone .labels .zstatus { color: var(--ink-dim); }
    .card .zone .zrule {
      height: 1px; margin: 5px 0 8px;
      background: linear-gradient(90deg, transparent, var(--rule) 6%, var(--rule) 94%, transparent);
    }
    .card .zone .ztitle {
      font-family: var(--serif); font-weight: 500; font-size: 1.32rem;
      line-height: 1.12; color: var(--ink);
    }
    .card .zone .zfinding {
      font-family: var(--serif); font-style: italic; font-size: 1.06rem;
      line-height: 1.4; color: var(--ink-dim); margin-top: 7px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    /* dispatch is tall/narrow — give title/finding more room, smaller finding */
    .card.dispatch .zone .zfinding { -webkit-line-clamp: 4; font-size: 1.0rem; }
    .card.instrument .zone .zfinding, .card.plate .zone .zfinding { -webkit-line-clamp: 2; }

    .card[href]:hover { box-shadow: 0 1px 0 var(--rule), 0 22px 46px -26px rgba(0,0,0,.55); }
    .card .extlink {
      position: absolute; bottom: 22px; right: 22px; z-index: 4;
      font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.1em;
      color: var(--accent); opacity: 0; transition: opacity var(--frost-dur) var(--ease);
    }
    .card[href]:hover .extlink { opacity: 1; }

    /* ── ENTRANCE — opaque milk-glass lab doors that part at the seam ──── */
    .entrance { position: fixed; inset: 0; z-index: 200; cursor: pointer; display: flex; }
    .entrance .leaf {
      position: relative; height: 100%; overflow: hidden;
      display: flex; align-items: center;
      -webkit-backdrop-filter: blur(40px) saturate(1.05) brightness(1.04);
      backdrop-filter: blur(40px) saturate(1.05) brightness(1.04);
      transition: transform 1200ms cubic-bezier(.62,.02,.10,1);
      will-change: transform;
    }
    /* seam off-centre, 20% left of middle (leaf split at 30%) */
    .entrance .leaf-l {
      width: 30%; justify-content: flex-end;
      background:
        radial-gradient(150% 78% at 62% 17%, rgba(255,255,255,.98), rgba(255,255,255,0) 60%),
        linear-gradient(158deg, rgba(223,233,232,.92), rgba(204,219,218,.96));
      box-shadow: inset 0 0 0 1px rgba(28,38,38,.10), inset -1px 0 0 rgba(28,38,38,.24), inset 0 0 150px rgba(120,150,150,.20);
    }
    .entrance .leaf-r {
      width: 70%; justify-content: flex-start;
      background:
        radial-gradient(80% 70% at 16% 22%, rgba(255,255,255,.80), rgba(255,255,255,0) 55%),
        linear-gradient(158deg, rgba(214,225,224,.93), rgba(200,215,214,.96));
      box-shadow: inset 0 0 0 1px rgba(28,38,38,.10), inset 1px 0 0 rgba(28,38,38,.24), inset 0 0 200px rgba(120,150,150,.20);
    }
    .entrance .emark {
      font-family: var(--grotesk); font-weight: 600;
      font-size: clamp(1.9rem, 5vw, 3.8rem); letter-spacing: 0.10em;
      color: rgba(52,66,64,.30);
      text-shadow: 0 1px 0 rgba(255,255,255,.65), 0 -1px 0 rgba(38,50,50,.05);
      user-select: none; white-space: nowrap;
    }
    .entrance .leaf-l .emark { padding-right: 0.45rem; }   /* meets the seam */
    .entrance .leaf-r .emark { padding-left: 0.55rem; }
    .entrance .emark.studio {                              /* smaller, spaced, darker */
      font-family: var(--mono); font-weight: 400;
      font-size: clamp(0.95rem, 2.3vw, 1.6rem); letter-spacing: 0.42em;
      color: rgba(32,44,42,.52);
    }
    .entrance .ehint {
      position: fixed; left: 0; right: 0; bottom: 9%; text-align: center;
      font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.3em;
      text-transform: uppercase; color: rgba(52,66,64,.42);
      animation: ehint 3.2s ease-in-out infinite; user-select: none;
      transition: opacity 400ms ease;
    }
    @keyframes ehint { 0%,100% { opacity: .32; } 50% { opacity: .72; } }
    .entrance.open .leaf-l { transform: translateX(-100%); }
    .entrance.open .leaf-r { transform: translateX(100%); }
    .entrance.open .ehint { opacity: 0; }
    @media (prefers-reduced-motion: reduce) {
      .entrance .leaf { transition: opacity 500ms ease; }
      .entrance.open .leaf { transform: none; opacity: 0; }
    }

    /* ── FOOTER ──────────────────────────────────────────────────────── */
    footer {
      padding: 2rem 4rem; border-top: 1px solid var(--rule);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
      font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; color: var(--ink-faint);
    }
    footer nav { display: flex; gap: 1.4rem; }
    footer a { color: var(--ink-dim); text-decoration: none; }
    footer a:hover { color: var(--accent); }
    @media (max-width: 1100px) { footer { padding-left: 2rem; padding-right: 2rem; } }

    .empty { font-family: var(--mono); font-size: 0.8rem; color: var(--ink-faint); padding: 3rem 0; }
  </style>
</head>
<body>

  <!-- Milk-glass lab doors — part at the seam to reveal the gallery -->
  <div class="entrance" id="entrance" role="button" tabindex="0" aria-label="Enter the gallery">
    <div class="leaf leaf-l"><span class="emark">llUll</span></div>
    <div class="leaf leaf-r"><span class="emark studio">studio</span></div>
    <div class="ehint">Slide to enter</div>
  </div>

  <header>
    <div class="wordmark"><a href="index.html">llUll <span class="studio">studio</span></a></div>
    <div class="header-right">
      <nav class="header-nav">
        <a href="index.html">Lobby</a>
        <a href="gallery.html" aria-current="page">Gallery</a>
        <a href="map.html">Map</a>
        <a href="https://rllull.substack.com" target="_blank" rel="noopener">Substack</a>
      </nav>
      <div class="ambient" role="group" aria-label="Ambient light">
        <button data-theme="dawn">Dawn</button>
        <button data-theme="day" aria-pressed="true">Day</button>
        <button data-theme="dusk">Dusk</button>
        <button data-theme="night">Night</button>
      </div>
    </div>
  </header>

  <div class="gallery-head">
    <h1>The <em>catalog.</em></h1>
    <p class="lede">Every instrument the studio has made or is making — studies, tools, dispatches, plates. The glass tells you what kind of thing it is.</p>
    <div class="filters" id="filters">
      <span class="flabel">Type</span>
      <button data-filter="all" aria-pressed="true">All</button>
      <button data-filter="study"><span class="dot" style="background:#2a5c3a"></span>Study</button>
      <button data-filter="instrument"><span class="dot" style="background:#344e80"></span>Instrument</button>
      <button data-filter="dispatch"><span class="dot" style="background:#c89244"></span>Dispatch</button>
      <button data-filter="plate"><span class="dot" style="background:#8a8276"></span>Plate</button>
    </div>
  </div>

  <main id="gallery"></main>

  <footer>
    <span>llUll Studio · Instruments for clarity</span>
    <nav>
      <a href="https://rllull.substack.com" target="_blank" rel="noopener">Substack</a>
      <a href="https://cognitivecellar.com" target="_blank" rel="noopener">cognitivecellar.com</a>
    </nav>
  </footer>

    {type:'dispatch', num:'01', title:'Fireflies in the Void', finding:'One dispatch from Study 01.', group:'Study 01', glyph:'CC', mark:'dispatch', status:'Live'},
    {type:'dispatch', num:'02', title:'The Cuckoo Protocol · The Damaged Nest', finding:'Two dispatches from Study 02 — Damaged Nest pending.', group:'Study 02', glyph:'CC', mark:'dispatch', status:'Live / Pending', href:SUB+'the-cuckoo-protocol'},
    {type:'dispatch', num:'07', title:'The Legitimacy Mechanism', finding:'Authority that names itself loses it.', group:'Study 07', glyph:'CC', mark:'dispatch', status:'Live', href:SUB+'the-legitimacy-mechanism'},

  ];

  const SECTIONS = [
    {type:'study',      label:'Study',      note:'analytical investigations · Cognitive Cellar', swatch:'#2a5c3a'},
    {type:'instrument', label:'Instrument', note:'functional tools + live products',             swatch:'#344e80'},
    {type:'dispatch',   label:'Dispatch',   note:'articles · essays · print',                     swatch:'#c89244'},
    {type:'plate',      label:'Plate',      note:'studio oi visual works',                        swatch:'#8a8276'}
  ];

  function cardHTML(c) {
    const tag = c.href ? 'a' : 'div';
    const hrefAttr = c.href ? ` href="${c.href}" target="_blank" rel="noopener"` : '';
    const num = c.num ? `<span class="num">${c.num}</span>` : '';
    const ext = c.href ? `<span class="extlink">open →</span>` : '';
    return `<${tag} class="card ${c.type}"${hrefAttr}>
      ${num}
      <div class="badge"><span class="bglyph">${c.glyph}</span><span class="blabel">${c.group}</span></div>
      <div class="zone">
        <div class="labels"><span class="ztype">${c.type}</span> <span class="zstatus">· ${c.status}</span></div>
        <div class="zrule"></div>
        <div class="ztitle">${c.title}</div>
        <div class="zfinding">${c.finding}</div>
      </div>
      ${ext}
    </${tag}>`;
  }

  function render(filter='all') {
    const main = document.getElementById('gallery');
    main.innerHTML = SECTIONS.map(s => {
      if (filter !== 'all' && filter !== s.type) return '';
      const items = CARDS.filter(c => c.type === s.type);
      return `<section class="type-section">
        <div class="section-label"><span class="swatch" style="background:${s.swatch}"></span>${s.label}<span class="count">${items.length} · ${s.note}</span></div>
        <div class="grid grid-${s.type}">${items.map(cardHTML).join('')}</div>
      </section>`;
    }).join('') || '<p class="empty">Nothing here.</p>';
  }

  // filters
  document.getElementById('filters').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#filters button').forEach(x => x.setAttribute('aria-pressed', x === b));
    render(b.dataset.filter);
  });
  // ambient
  document.querySelector('.ambient').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.documentElement.setAttribute('data-theme', b.dataset.theme);
    document.querySelectorAll('.ambient button').forEach(x => x.setAttribute('aria-pressed', x === b));
  });

  render();

  // entrance: slide the milk-glass door aside on click / key
  const ent = document.getElementById('entrance');
  function enter() {
    if (ent.classList.contains('open')) return;
    ent.classList.add('open');
    ent.addEventListener('transitionend', () => { ent.style.display = 'none'; }, { once: true });
    setTimeout(() => { ent.style.display = 'none'; }, 1300); // fallback
  }
  ent.addEventListener('click', enter);
  ent.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); } });
  </script>
