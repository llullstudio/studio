<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tarifa Lounge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: full-bleed 3D room, quiet whitewash cards in the corners. Single light look by choice: lime-washed walls, azulete-blue accent. */
:root{
  --wash:#eef0f1;
  --ink:#1f2a33;
  --ink-dim:#5d6a74;
  --azulete:#2f5ea8;
  --line:rgba(31,42,51,.14);
  --panel:rgba(248,249,250,.86);
  --display:"Young Serif", Georgia, serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--wash);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.chrome{position:fixed;left:0;right:0;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{top:0;padding-block:calc(14px + env(safe-area-inset-top,0px)) 0;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.bottom{bottom:0;padding-block:0 calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.card{pointer-events:auto;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:3px;padding:12px 14px;min-width:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--azulete)}
h1{font-family:var(--display);font-weight:400;font-size:22px;margin:4px 0 2px;text-wrap:balance}
.sub{font-size:13px;color:var(--ink-dim)}
.dims{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);margin-top:6px}
details{max-width:340px}
summary{cursor:pointer;font-size:13px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" +";color:var(--azulete)}
details[open] summary::after{content:" –"}
dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px}
dt{color:var(--azulete);font-size:11px;font-weight:600;letter-spacing:.06em;padding-top:1px}
dd{margin:0;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.note{font-size:11.5px;color:var(--ink-dim);margin-top:8px;line-height:1.45}
.views{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
.views button{font:600 12px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.views button[aria-pressed="true"]{border-color:var(--azulete);color:var(--azulete)}
.views button:focus-visible,summary:focus-visible{outline:2px solid var(--azulete);outline-offset:2px}
.hint{font-size:12px;color:var(--ink-dim)}
#loading[hidden]{display:none}
.popup{pointer-events:auto;align-self:flex-start;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:8px;max-width:100%;box-shadow:0 6px 24px rgba(31,42,51,.10)}
.popup[hidden]{display:none}
.prow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prow .k{font-size:10.5px;font-weight:600;letter-spacing:.14em;color:var(--azulete);width:62px}
.prow button{font:600 11.5px var(--body);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer}
.prow button small{font-weight:400;color:var(--ink-dim);margin-left:4px}
.prow button[aria-pressed="true"]{background:var(--azulete);border-color:var(--azulete);color:#fff}
.prow button[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.pnote{font:11px var(--mono);color:var(--ink-dim)}
.titlebar{padding:7px 12px;max-width:min(460px,100%)}
.titlebar summary{font-family:var(--display);font-weight:400;font-size:15px}
.titlebar .eyebrow{font-family:var(--body);margin-right:6px}
.titlebar .sub{margin-top:6px;line-height:1.45}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.dl{position:absolute;left:0;top:0;font:500 11px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--azulete);background:rgba(248,249,250,.88);border:1px solid rgba(47,94,168,.35);border-radius:2px;padding:3px 5px;white-space:nowrap;will-change:transform}
#labels[hidden]{display:none}

#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:var(--azulete)}
@media (max-width:560px){h1{font-size:19px}details{max-width:100%}.top{flex-direction:column}}
</style>

<div id="stage"></div>
<div id="loading">BUILDING ROOM…</div>

<div id="labels" aria-hidden="true"></div>

<div class="chrome bottom">
  <div class="popup" id="propPanel" hidden>
    <div class="prow" id="ottRow"><span class="k">OTTOMAN</span></div>
    <div class="prow" id="rugRow"><span class="k">RUG</span></div>
    <div class="prow"><span class="k">MOVE</span><button type="button" id="rotL" title="Rotate left 15°">⟲ 15°</button><button type="button" id="rotR" title="Rotate right 15°">⟳ 15°</button><button type="button" id="rotFine" title="Rotate 5°">⟳ 5°</button><button type="button" id="poseReset">Center on rug</button><span class="pnote">drag the ottoman to move it</span></div>
    <div class="pnote" id="propNote"></div>
  </div>
  <div class="views" role="group" aria-label="Views">
    <button type="button" data-view="overview" aria-pressed="true">Overview</button>
    <button type="button" data-view="plan">Plan</button>
    <button type="button" data-view="lamp">Lamp alcove</button>
    <button type="button" data-view="cabinet">Cabinet alcove</button>
    <button type="button" data-view="doors">Doors</button>
    <button type="button" id="doorToggle" aria-pressed="false">Doors open</button>
    <button type="button" id="dimToggle" aria-pressed="false">Dimensions</button>
    <button type="button" id="cornerToggle" aria-pressed="false">Corner letters</button>
    <button type="button" id="brickToggle" aria-pressed="false">Brick</button>
    <button type="button" id="propToggle" aria-pressed="false">Proposed</button>
  </div>
  <div class="hint">Drag to orbit · scroll or pinch to zoom · right-drag to pan</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const T = THREE;
// ---------- survey (plan cm; origin = corner of the 173 and 180 tapes; y = tile long axis) ----------
const H = 318;
// Corners from the 27 Oct plan (floorplan_v8): alcoves exact from bench measurements; skirting ~0.5/corner; tapes not assumed square.
const A = [-102.48, 153.15], C = [36.40, 183.54], D = [26.58, 235.01], E = [123.68, 247.46], F = [127.16, 195.18], G = [151.31, 198.29],
      Hc = [153.87, 152.91], J = [205.87, 153.30], K = [206.57, 57.80], Lc = [179.57, 57.60], M = [180, 0], N = [205, 0];
const B = [-13.12, 172.70];   // where the 173 tape meets the long wall
const FL = C, FR = F, BL = D, BR = E, PIER = G;              // lamp alcove and corner pier
const CT = Hc, CBK_T = J, CBK_B = K, CB = Lc;                 // cabinet alcove
// door wall: straight line down from A, [42.43, 233.60]EG° off the 173 tape
const DPSI = -1.45856, du = [Math.cos(DPSI), Math.sin(DPSI)], dout = [du[1], -du[0]];
const DOORX = A[0], DOORTOP = A[1];
const DP = y => [A[0] + (DOORTOP - y)*du[0], A[1] + (DOORTOP - y)*du[1]];          // point on the door wall, by its old y
const DPo = (y, o) => { const q = DP(y); return [q[0] + o*dout[0], q[1] + o*dout[1]]; }; // same, pushed o into the wall
const outline = [ N, M, CB,  // the 57.5 wall; at the end of the 180 tape the wall turns and runs 25 toward the bedroom door
  CBK_B, CBK_T, CT, PIER, FR, BR, BL, FL, B, A ];

// ---------- three setup ----------
const stage = document.getElementById('stage');
const renderer = new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = false;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.outputEncoding = T.sRGBEncoding;
stage.appendChild(renderer.domElement);
const scene = new T.Scene();
scene.background = new T.Color('#eef0f1');
const camera = new T.PerspectiveCamera(50, 1, 1, 6000);
const controls = new T.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.499;

scene.add(new T.HemisphereLight('#ffffff', '#b98a6a', 0.7));
// light falls from above, so every vertical wall reads the same white whatever its angle
const sun = new T.DirectionalLight('#fff3e2', 0.45);
sun.position.set(0, 1000, 80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-400, right:400, top:400, bottom:-400, near:10, far:2000});
sun.shadow.bias = -0.0005;
scene.add(sun);
scene.add(new T.AmbientLight('#ffffff', 0.25));

const V = (p, h=0) => new T.Vector3(p[0], h, -p[1]);
const solids = [];
const wallMat = new T.MeshLambertMaterial({color:'#efeee9', side:T.DoubleSide}); // matte lime plaster: no sheen
const massMat = wallMat;
const edgeMat = new T.LineBasicMaterial({color:'#d2ccc3'});
function edges(m){ m.add(new T.LineSegments(new T.EdgesGeometry(m.geometry, 25), edgeMat)); }
const skirtMat = new T.MeshStandardMaterial({color:'#9a4a2c', roughness:0.8});
const tapeMat = new T.MeshBasicMaterial({color:'#e8dcd2', transparent:true, opacity:0.35, depthWrite:false});
const woodMat = new T.MeshStandardMaterial({color:'#7a4524', roughness:0.7});

function boxAlong(a, b, h0, h1, t, side, mat, extend){
  const dx = b[0]-a[0], dy = b[1]-a[1], len = Math.hypot(dx,dy);
  const nx = dy/len*side, ny = -dx/len*side; // side=+1 outward (right of travel), -1 inward
  const g = new T.BoxGeometry(len + (extend||0), h1-h0, t);
  const m = new T.Mesh(g, mat);
  m.position.set((a[0]+b[0])/2 + nx*t/2, (h0+h1)/2, -((a[1]+b[1])/2 + ny*t/2));
  m.rotation.y = Math.atan2(dy, dx);
  m.castShadow = m.receiveShadow = true;
  scene.add(m); if(mat === wallMat) solids.push(m);
  return m;
}

// ---------- floor: terracotta running bond ----------
(function floor(){
  const TW = 15.933, TL = 30.944, cols = 8, rows = 4, px = 8; // px per cm
  const cw = Math.round(cols*TW*px), ch = Math.round(rows*TL*px);
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const g = cv.getContext('2d');
  g.fillStyle = '#93817a'; g.fillRect(0,0,cw,ch); // grout: gray, close in value to the tile
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const grout = 0.5*px;
  for(let i=0;i<cols;i++){
    const off = (i%2) ? TL/2 : 0;
    for(let j=-1;j<=rows;j++){
      const x = i*TW*px, y = (j*TL + off)*px;
      const r = 158 + rnd()*10, gg = 88 + rnd()*7, b = 64 + rnd()*5;
      g.fillStyle = `rgb(${r|0},${gg|0},${b|0})`;
      g.fillRect(x+grout/2, y+grout/2, TW*px-grout, TL*px-grout);
    }
  }
  const tex = new T.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = T.RepeatWrapping;
  tex.encoding = T.sRGBEncoding;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.repeat.set(1/(cols*TW), 1/(rows*TL));
  const poly = [[N[0],-90]].concat(outline).concat([DP(-90)]);
  const geo = new T.ShapeGeometry(new T.Shape(poly.map(p => new T.Vector2(p[0], p[1]))));
  geo.rotateX(-Math.PI/2);
  const m = new T.Mesh(geo, new T.MeshStandardMaterial({map:tex, roughness:0.85}));
  m.receiveShadow = true;
  scene.add(m);
})();

// ---------- walls + skirting: one mitered solid each, so corners close cleanly ----------
function offsetLine(pts, d){ // d>0: right of travel (outside the room), d<0: inside
  const n = [];
  for(let i=0;i<pts.length-1;i++){ const dx=pts[i+1][0]-pts[i][0], dy=pts[i+1][1]-pts[i][1], l=Math.hypot(dx,dy); n.push([dy/l, -dx/l]); }
  return pts.map((p,i) => {
    if(i===0) return [p[0]+n[0][0]*d, p[1]+n[0][1]*d];
    if(i===pts.length-1) return [p[0]+n[i-1][0]*d, p[1]+n[i-1][1]*d];
    let mx=n[i-1][0]+n[i][0], my=n[i-1][1]+n[i][1]; const ml=Math.hypot(mx,my); mx/=ml; my/=ml;
    const k = Math.min(4, 1/Math.max(0.25, mx*n[i][0]+my*n[i][1]));
    return [p[0]+mx*d*k, p[1]+my*d*k];
  });
}
function band(pts, d, h0, h1, mat){
  const ring = pts.concat(offsetLine(pts, d).reverse());
  const geo = new T.ExtrudeGeometry(new T.Shape(ring.map(p => new T.Vector2(p[0], p[1]))), {depth:h1-h0, bevelEnabled:false});
  geo.rotateX(-Math.PI/2);
  const m = new T.Mesh(geo, mat); m.position.y = h0; scene.add(m); if(mat === wallMat) solids.push(m); return m;
}
// door wall: two separate doors, 50 apart, both hinged on the corner side, both swing in
// terrace door nearest the corner, outside door further along; both in the same wall plane
const DW = 82.5, DH = 198, CAS = 7.5, CAS_A = 5.5, PIERW = 50; // surrounds 7.5, except 5.5 where the terrace door meets the wall at A; 50 door to door leaves 35 of white wall
const doorsSpec = [
  {name:'terrace', top: DOORTOP - CAS_A, recess: 0, casTop: CAS_A},
  {name:'outside', top: DOORTOP - CAS_A - DW - PIERW, recess: 0, casTop: CAS},
];
doorsSpec.forEach(d => { d.bot = d.top - DW; });
const [dA, dB] = doorsSpec;
// solid walls: the whole outline as one mitered band, ending at the first door
const mainWall = outline.concat([DP(dA.top)]);
// walls as one solid block: room outline inside, a plain rectangle outside (no outer contouring)
(function poche(){
  const XR = Math.max(J[0], K[0]) + 14, YT = Math.max(BL[1], BR[1]) + 14, q = DPo(dA.top, 14);
  const pts = outline.concat([DP(dA.top), q, [q[0], YT], [XR, YT], [XR, M[1]]]);
  const geo = new T.ExtrudeGeometry(new T.Shape(pts.map(p => new T.Vector2(p[0], p[1]))), {depth:H, bevelEnabled:false});
  geo.rotateX(-Math.PI/2);
  const m = new T.Mesh(geo, wallMat); scene.add(m); solids.push(m); edges(m); // faint lines only at real corners (over 25°)
})();
boxAlong(DP(dA.bot),DP(dB.top),0,H,14,+1,wallMat,0);
boxAlong(DP(dB.bot),DP(-90),0,H,14,+1,wallMat,0);
doorsSpec.forEach(d => boxAlong(DP(d.top),DP(d.bot),DH+2,H,14,+1,wallMat,0));
// skirting: continuous along every wall, broken only at the two door thresholds
band(mainWall, -2.25, 0, 7.5, skirtMat);
band([DP(dA.bot),DP(dB.top)], -2.25, 0, 7.5, skirtMat);
band([DP(dB.bot),DP(-90)], -2.25, 0, 7.5, skirtMat);
// wood surrounds: 8 wide on the wall face (sides and head, none at the floor), plus lining through the wall
doorsSpec.forEach(d => {
  boxAlong(DP(d.top+d.casTop),DP(d.top),0,DH+CAS,2.5,-1,woodMat,0);
  boxAlong(DP(d.bot),DP(d.bot-CAS),0,DH+CAS,2.5,-1,woodMat,0);
  boxAlong(DP(d.top+d.casTop),DP(d.bot-CAS),DH,DH+CAS,2.5,-1,woodMat,0);
  boxAlong(DPo(d.top,14),DP(d.top),0,DH,2,+1,woodMat,0);
  boxAlong(DPo(d.bot,14),DP(d.bot),0,DH,2,-1,woodMat,0);
  boxAlong(DP(d.top),DP(d.bot),DH,DH+2,14,+1,woodMat,0);
});

// doors: planks + iron studs
function doorTexture(){
  const cv = document.createElement('canvas'); cv.width = 330; cv.height = 792;
  const g = cv.getContext('2d');
  g.fillStyle = '#8a4e2a'; g.fillRect(0,0,330,792);
  for(let k=0;k<5;k++){ g.fillStyle = k%2 ? '#93552f' : '#82482a'; g.fillRect(k*66+3,0,60,792);
    g.fillStyle = 'rgba(40,20,10,.55)'; g.fillRect(k*66,0,3,792); }
  g.fillStyle = '#2b1d16';
  [60, 396, 732].forEach(y => { for(let k=0;k<5;k++){ g.beginPath(); g.arc(k*66+33, y, 7, 0, 7); g.fill(); } });
  const t = new T.CanvasTexture(cv); t.encoding = T.sRGBEncoding; return t;
}
const dMat = new T.MeshStandardMaterial({map:doorTexture(), roughness:0.75});
// hinge on the corner-side (higher y) edge; closed leaf runs toward -y; opens into the room (+x)
function makeLeaf(d){
  const h = DP(d.top), hx = h[0] - dout[0], hy = h[1] - dout[1];
  const pivot = new T.Group();
  pivot.position.set(hx, 0, -hy); pivot.userData.base = DPSI + Math.PI/2; pivot.rotation.y = pivot.userData.base;
  const leaf = new T.Mesh(new T.BoxGeometry(DW, DH, 4), [woodMat,woodMat,woodMat,woodMat,dMat,dMat]);
  leaf.position.set(0, DH/2, DW/2);
  leaf.rotation.y = Math.PI/2;
  pivot.add(leaf); scene.add(pivot);
  return {pivot, hx, hy};
}
const leaves = doorsSpec.map(makeLeaf);
let doorsOpen = false, doorT = 0;

// swing arcs on the floor
(function arcs(){
  const mat = new T.LineDashedMaterial({color:'#2f5ea8', dashSize:4, gapSize:3});
  leaves.forEach(l => {
    const pts = [];
    const cb = Math.cos(DPSI+Math.PI/2), sb = Math.sin(DPSI+Math.PI/2);
    for(let k=0;k<=32;k++){ const a = k/32*Math.PI/2, x = Math.sin(a)*DW, y = -Math.cos(a)*DW; pts.push(new T.Vector3(l.hx + x*cb - y*sb, 0.4, -(l.hy + x*sb + y*cb))); }
    const ln = new T.Line(new T.BufferGeometry().setFromPoints(pts), mat); ln.computeLineDistances(); scene.add(ln);
    const leg = new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(l.hx,0.4,-l.hy), new T.Vector3(l.hx-dout[0]*DW,0.4,-(l.hy-dout[1]*DW))]), mat); leg.computeLineDistances(); scene.add(leg);
  });
})();

// ---------- lamp alcove: solid mass above the 172 square top (floor to top; 148 more to the ceiling) ----------
const aboveParts = [];
function massAbove(poly, h0, capMat){
  const sh = new T.Shape(poly.map(p => new T.Vector2(p[0], p[1])));
  const geo = new T.ExtrudeGeometry(sh, {depth:H-h0, bevelEnabled:false});
  geo.rotateX(-Math.PI/2);
  const m = new T.Mesh(geo, capMat ? [capMat, massMat] : massMat); // extrude groups: 0 = top/bottom caps, 1 = sides
  m.position.y = h0; m.castShadow = m.receiveShadow = true;
  scene.add(m); aboveParts.push(m); solids.push(m);
}
const soffitTone = new T.MeshLambertMaterial({color:'#d3cec5', side:T.DoubleSide});
massAbove([FL, FR, BR, BL], 172, soffitTone);

// ---------- cabinet alcove: segmental arch 203.5 → 220 in the plane of the 57.5 wall, 27 deep on both sides ----------
const JKl = Math.hypot(J[0]-K[0], J[1]-K[1]), kw = [(J[0]-K[0])/JKl, (J[1]-K[1])/JKl], kin = [-kw[1], kw[0]];           // along the back wall, and into the room
const AK = [K[0]+27*kin[0], K[1]+27*kin[1]], AJ = [J[0]+27*kin[0], J[1]+27*kin[1]];   // arch line, 27 in front of the back wall
massAbove([AK, K, J, AJ], 220);
(function vault(){
  const span = JKl, rise = 16.5, R = (span*span/4 + rise*rise)/(2*rise), cy = 220 - R, N2 = 48;
  const hAt = t => cy + Math.sqrt(R*R - Math.pow(span*(t-0.5),2));
  const vp = [], vi = [], sp = [], si = [];
  for(let k=0;k<=N2;k++){
    const t = k/N2, h = hAt(t);
    const f = [AK[0]+(AJ[0]-AK[0])*t, AK[1]+(AJ[1]-AK[1])*t], b = [K[0]+(J[0]-K[0])*t, K[1]+(J[1]-K[1])*t];
    vp.push(f[0], h, -f[1],  b[0], h, -b[1]);
    sp.push(f[0], h, -f[1],  f[0], 220, -f[1]);
  }
  for(let k=0;k<N2;k++){ const a=k*2, b=(k+1)*2; vi.push(a,a+1,b, b,a+1,b+1); si.push(a,b,a+1, b,b+1,a+1); }
  const vg = new T.BufferGeometry(); vg.setAttribute('position', new T.Float32BufferAttribute(vp,3)); vg.setIndex(vi); vg.computeVertexNormals();
  const sg = new T.BufferGeometry(); sg.setAttribute('position', new T.Float32BufferAttribute(sp,3)); sg.setIndex(si); sg.computeVertexNormals();
  const soffitMat = new T.MeshLambertMaterial({color:'#d3cec5', side:T.DoubleSide});
  [[vg, soffitMat], [sg, wallMat]].forEach(([g, mat]) => { const m = new T.Mesh(g, mat); scene.add(m); aboveParts.push(m); });
})();

// ---------- alcove back walls a shade darker, so the openings read ----------

    const len = Math.hypot(b[0]-a[0], b[1]-a[1]), u = [(b[0]-a[0])/len, (b[1]-a[1])/len];
    let n = [-u[1], u[0]]; if((inside[0]-a[0])*n[0] + (inside[1]-a[1])*n[1] < 0) n = [-n[0], -n[1]];
    const g = new T.ShapeGeometry(new T.Shape(outline2d.map(p => new T.Vector2(p[0], p[1]))));
    const uv = g.attributes.uv; for(let i=0;i<uv.count;i++) uv.setX(i, uv.getX(i) + (uOff||0));
    const pos = g.attributes.position, out = [];
    for(let i=0;i<pos.count;i++){ const x = pos.getX(i), y = pos.getY(i);
      out.push(a[0] + u[0]*x + n[0]*0.6, y, -(a[1] + u[1]*x + n[1]*0.6)); }
    g.setAttribute('position', new T.Float32BufferAttribute(out, 3)); g.computeVertexNormals();

  }

  brickWall(BL, BR, rect(seg(BL,BR), 7.5, 172), lampIn, 0);   // back walls only
  // cabinet alcove: sides to the 203.5 spring line, back wall up under the segmental arch (apex 220)
  const cabIn = [(CB[0]+CBK_T[0])/2, (CB[1]+CBK_T[1])/2];
  const span = JKl, rise = 16.5, R = (span*span/4 + rise*rise)/(2*rise), cy = 220 - R, back = [[0,7.5],[span,7.5]];

const dotGeo = new T.CircleGeometry(0.7, 8); dotGeo.rotateX(-Math.PI/2);
const dotMat = new T.MeshBasicMaterial({color:'#efe6dc', transparent:true, opacity:0.32, depthWrite:false});
function tape(a, b){   // faint dotted line, one dot every 6 cm
  const L = Math.hypot(b[0]-a[0], b[1]-a[1]), n = Math.floor(L/6);
  for(let i=0;i<=n;i++){ const t = i/n, d = new T.Mesh(dotGeo, dotMat); d.position.set(a[0]+(b[0]-a[0])*t, 0.35, -(a[1]+(b[1]-a[1])*t)); scene.add(d); }
}

function floorLabel(text, x, y, rot){
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 128;
  const g = cv.getContext('2d');
  g.font = '600 58px Figtree, system-ui, sans-serif'; g.fillStyle = '#1f2a33'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 512, 64);
  const tex = new T.CanvasTexture(cv); tex.encoding = T.sRGBEncoding;
  const geo = new T.PlaneGeometry(128, 16); geo.rotateX(-Math.PI/2);
  const m = new T.Mesh(geo, new T.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false}));
  m.position.set(x, 0.6, -y); m.rotation.y = rot || 0; scene.add(m);
}

function dim(a, b, h, off, text){
  const dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy), nx=-dy/l, ny=dx/l;

    if(p.z > 1 || p.z < -1){ l.el.style.visibility = 'hidden'; return; }
    dir.subVectors(l.v, camera.position); const dist = dir.length(); ray.set(camera.position, dir.normalize()); ray.far = dist - 3;
    if(ray.intersectObjects(solids, false).some(hit => hit.object.visible)){ l.el.style.visibility = 'hidden'; return; }
    l.el.style.visibility = 'visible';
    l.el.style.transform = `translate(${((p.x+1)/2*w).toFixed(1)}px,${((1-p.y)/2*h).toFixed(1)}px) translate(-50%,-50%)`;
  });
}

const tog = document.getElementById('doorToggle');
tog.addEventListener('click', () => { doorsOpen = !doorsOpen; tog.setAttribute('aria-pressed', String(doorsOpen)); });

function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();
go('overview', true);
document.getElementById('loading').hidden = true;

(function loop(now){
  requestAnimationFrame(loop);
  if(anim){
    const k = Math.min(1, (now - anim.start)/700), e = k<.5 ? 2*k*k : 1 - Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(anim.p0, anim.p1, e); controls.target.lerpVectors(anim.t0, anim.t1, e); camera.fov = anim.f0 + (anim.f1-anim.f0)*e; camera.updateProjectionMatrix();
    if(k === 1) anim = null;
  }
  const goal = doorsOpen ? 1 : 0;
  doorT += (goal - doorT) * 0.12;
  leaves.forEach(l => { l.pivot.rotation.y = l.pivot.userData.base + doorT * Math.PI/2; });
  controls.update();
  renderer.render(scene, camera);
  placeLabels();
})(performance.now());
})();
</script>
